name: Release

# 推 v* 标签即自动创建 Release，并附上 dist/ 下对应版本的 jar。
# 附件不入流水线构建 —— jar 由本地构建后提交到 dist/，Actions 只负责发布，
# 这样流水线不依赖 GTNH Maven，也不会因为上游快照变动而产出不可复现的字节。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: 发布 ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 定位并校验附件
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          JAR=$(ls dist/*-"${TAG}".jar 2>/dev/null | head -n1 || true)
          if [ -z "${JAR}" ]; then
            echo "::error::dist/ 下没有与标签 v${TAG} 对应的 jar。请先在本地构建、放入 dist/ 并随标签提交。"
            exit 1
          fi
          echo "附件：${JAR}"
          echo "JAR=${JAR}" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "${JAR}" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: 生成说明（注入实际校验值）
        run: |
          set -euo pipefail
          sed "s/__SHA256__/${SHA256}/" .github/release-notes.md > release-body.md
          echo "--- 说明正文 ---"
          cat release-body.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          files: ${{ env.JAR }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
